# Build and test hla-mqtt-rti on Windows (MSVC) and Linux (GCC).
# The tests need an MQTT broker: Mosquitto 2.
# Failures are also reported as annotations (readable without signing in).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake 4.x refuses cmake_minimum_required < 3.5 (paho-mqtt-c 1.3.13).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  HLA_MQTT_BROKER: tcp://localhost:1883

jobs:
  windows:
    name: Windows MSVC ${{ matrix.build_type }}
    # The local target is VS2019 (v142); the runner has VS2022 (v143), which
    # produces binaries compatible with v142 federates (same MSVC 14.x ABI).
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            preset: release
          - build_type: Debug
            preset: debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan 2
        run: pip install "conan>=2.0,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}

      - name: Dependencies (Paho MQTT, static)
        run: conan install . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=17 --build=missing

      - name: Configure
        run: cmake --preset conan-default

      - name: Build
        run: cmake --build --preset conan-${{ matrix.preset }} --parallel

      - name: Start Mosquitto
        shell: pwsh
        run: |
          choco install mosquitto -y --no-progress | Out-Host
          function Test-Broker {
            try { $c = [Net.Sockets.TcpClient]::new(); $c.Connect('127.0.0.1', 1883); $c.Close(); $true } catch { $false }
          }
          $exe = Get-ChildItem 'C:\Program Files\mosquitto', 'C:\Program Files (x86)\mosquitto' -Filter mosquitto.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          # 1) the Windows service installed by the package (localhost, anonymous)
          Start-Service mosquitto -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 10 -and -not (Test-Broker); $i++) { Start-Sleep 1 }
          # 2) otherwise the executable with the project configuration
          if (-not (Test-Broker) -and $exe) {
            $conf = Join-Path $PWD 'broker\mosquitto-hla.conf'
            Start-Process $exe.FullName -ArgumentList '-c', "`"$conf`"", '-v' -RedirectStandardError mosquitto.log -WindowStyle Hidden
            for ($i = 0; $i -lt 20 -and -not (Test-Broker); $i++) { Start-Sleep 1 }
          }
          if (Test-Broker) { 'broker up'; exit 0 }
          $svc = Get-Service mosquitto -ErrorAction SilentlyContinue
          Write-Output "::error::Mosquitto did not start (exe: $($exe.FullName); service: $($svc.Status))"
          if (Test-Path mosquitto.log) { Get-Content mosquitto.log -Tail 5 | ForEach-Object { Write-Output "::error::$_" } }
          exit 1

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --preset conan-${{ matrix.preset }} --output-on-failure --timeout 300 2>&1 | tee ctest.log || {
            grep -E '\[FAIL\]|Failed|Timeout|SOME TESTS|xception' ctest.log | head -9 | sed 's/^/::error::/'
            exit 1
          }

      - name: Exports of the RTI DLL
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter rti1516e.dll build | Select-Object -First 1
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports $dll.FullName
          "$($dll.FullName): $(($exports | Select-String '@rti1516e@@').Count) exported rti1516e symbols"

      - name: Artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hla-mqtt-rti-windows-x64
          path: |
            build/**/rti1516e.dll
            build/**/rti1516e.lib
            build/**/fedtime1516e.dll
            build/**/fedtime1516e.lib
            build/**/hla-test-federate.exe
          if-no-files-found: error

  linux:
    name: Linux GCC Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan 2
        run: pip install "conan>=2.0,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('conanfile.py') }}

      - name: Dependencies (Paho MQTT, static)
        run: conan install . -s build_type=Release -s compiler.cppstd=17 --build=missing

      - name: Configure
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/broker/mosquitto-hla.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
          for i in $(seq 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "broker up"; exit 0; fi
            sleep 1
          done
          docker logs mosquitto 2>&1 | tail -5 | sed 's/^/::error::/'
          exit 1

      - name: Test
        run: |
          set -o pipefail
          ctest --preset conan-release --output-on-failure --timeout 300 2>&1 | tee ctest.log || {
            grep -E '\[FAIL\]|Failed|Timeout|SOME TESTS|xception' ctest.log | head -9 | sed 's/^/::error::/'
            exit 1
          }

      - name: Broker log
        if: failure()
        run: docker logs mosquitto 2>&1 | tail -100
