# Build and test hla-mqtt-rti on Windows (MSVC) and Linux (GCC).
# The tests need an MQTT broker: Mosquitto 2.
# Failures are also reported as annotations (readable without signing in).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake 4.x refuses cmake_minimum_required < 3.5 (paho-mqtt-c 1.3.13).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  HLA_MQTT_BROKER: tcp://127.0.0.1:1883
  MOSQUITTO_VERSION: "2.1.4" # Windows installer, mosquitto.org/files/binary/win64

jobs:
  windows:
    name: Windows MSVC ${{ matrix.build_type }}
    # The local target is VS2019 (v142); the runner has VS2022 (v143), which
    # produces binaries compatible with v142 federates (same MSVC 14.x ABI).
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            preset: release
          - build_type: Debug
            preset: debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan 2
        run: pip install "conan>=2.0,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}

      - name: Dependencies (Paho MQTT, static)
        run: conan install . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=17 --build=missing

      - name: Configure
        run: cmake --preset conan-default

      - name: Build
        run: cmake --build --preset conan-${{ matrix.preset }} --parallel

      - name: Start Mosquitto
        shell: pwsh
        run: |
          function Test-Broker {
            try { $c = [Net.Sockets.TcpClient]::new(); $c.Connect('127.0.0.1', 1883); $c.Close(); $true } catch { $false }
          }
          # Official installer (NSIS, silent), then the broker with the project configuration.
          $url = 'https://mosquitto.org/files/binary/win64/mosquitto-${{ env.MOSQUITTO_VERSION }}-install-windows-x64.exe'
          Invoke-WebRequest $url -OutFile mosquitto-setup.exe
          Start-Process .\mosquitto-setup.exe -ArgumentList '/S' -Wait
          $exe = Get-ChildItem 'C:\Program Files\mosquitto' -Filter mosquitto.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::mosquitto.exe not found after installing $url"; exit 1 }
          # As a Windows service: a process started by a step does not outlive the step.
          Copy-Item (Join-Path $PWD 'broker\mosquitto-hla.conf') (Join-Path $exe.DirectoryName 'mosquitto.conf') -Force
          if (-not (Get-Service mosquitto -ErrorAction SilentlyContinue)) { & $exe.FullName install | Out-Host }
          Restart-Service mosquitto -ErrorAction SilentlyContinue
          Start-Service mosquitto -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 20 -and -not (Test-Broker); $i++) { Start-Sleep 1 }
          if (Test-Broker) { 'broker up'; exit 0 }
          $svc = Get-Service mosquitto -ErrorAction SilentlyContinue
          Write-Output "::error::Mosquitto did not start ($($exe.FullName), service: $($svc.Status))"
          exit 1

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null || echo "::error::broker not reachable before the tests"
          ctest --preset conan-${{ matrix.preset }} --output-on-failure --timeout 300 2>&1 | tee ctest.log || {
            grep -E '\[FAIL\]|Failed|Timeout|SOME TESTS|xception' ctest.log | head -9 | sed 's/^/::error::/'
            exit 1
          }

      - name: Exports of the RTI DLL
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter rti1516e.dll build | Select-Object -First 1
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports $dll.FullName
          "$($dll.FullName): $(($exports | Select-String '@rti1516e@@').Count) exported rti1516e symbols"

      - name: Artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hla-mqtt-rti-windows-x64
          path: |
            build/**/rti1516e.dll
            build/**/rti1516e.lib
            build/**/fedtime1516e.dll
            build/**/fedtime1516e.lib
            build/**/hla-test-federate.exe
          if-no-files-found: error

      # Same sources under the MAK RTI names, PE linker version 14.00 (VR-Link).
      - name: Build with MAK names
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          cmake -S . -B build-mak -G "Visual Studio 17 2022" -A x64             -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake             -DHLA_MQTT_MAK_NAMES=ON -DHLA_MQTT_RTI_BUILD_TESTS=OFF
          cmake --build build-mak --config Release --parallel
          for dll in librti1516e64 libfedtime1516e64; do
            build-mak/bin/Release/hla-pe-linker-version.exe --check build-mak/bin/Release/$dll.dll 14.00
          done

      - name: Artifacts (MAK names)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hla-mqtt-rti-windows-x64-mak
          path: |
            build-mak/bin/Release/librti1516e64.dll
            build-mak/bin/Release/libfedtime1516e64.dll
            build-mak/**/Release/librti1516e64.lib
            build-mak/**/Release/libfedtime1516e64.lib
          if-no-files-found: error

  linux:
    name: Linux GCC Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan 2
        run: pip install "conan>=2.0,<3"

      - name: Conan profile
        run: conan profile detect --force

      - name: Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-linux-${{ hashFiles('conanfile.py') }}

      - name: Dependencies (Paho MQTT, static)
        run: conan install . -s build_type=Release -s compiler.cppstd=17 --build=missing

      - name: Configure
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Start Mosquitto
        run: |
          # Host network: no docker-proxy between the federates and the broker.
          docker run -d --name mosquitto --network host \
            -v "$PWD/broker/mosquitto-hla.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
          for i in $(seq 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "broker up"; exit 0; fi
            sleep 1
          done
          docker logs mosquitto 2>&1 | tail -5 | sed 's/^/::error::/'
          exit 1

      - name: Test
        run: |
          set -o pipefail
          ctest --preset conan-release --output-on-failure --timeout 300 2>&1 | tee ctest.log || {
            grep -E '\[FAIL\]|Failed|Timeout|SOME TESTS|xception' ctest.log | head -9 | sed 's/^/::error::/'
            exit 1
          }

      - name: Broker log
        if: failure()
        run: docker logs mosquitto 2>&1 | tail -100
