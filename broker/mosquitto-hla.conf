# Mosquitto 2.x - broker de développement pour hla-mqtt-rti
# ATTENTION : accès anonyme, sans TLS. Réservé au réseau de développement.
# No address: every interface, IPv4 and IPv6 ("localhost" is ::1 first on Windows).
listener 1883
allow_anonymous true
persistence false
# Nagle off: small messages (updates, QoS 1 acks) are sent at once.
set_tcp_nodelay true
# A federate may receive bursts (updates, interactions): the default queue of
# 1000 messages per client silently drops QoS 1 messages beyond it.
max_queued_messages 100000
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
