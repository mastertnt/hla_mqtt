# Mosquitto 2.x - broker de développement pour hla-mqtt-rti
# ATTENTION : accès anonyme, sans TLS. Réservé au réseau de développement.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
# Nagle off: without it Linux delays small messages (QoS 1 acks, updates)
# by tens of milliseconds (delayed ACK), ~50 messages/s instead of thousands.
set_tcp_nodelay true
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
